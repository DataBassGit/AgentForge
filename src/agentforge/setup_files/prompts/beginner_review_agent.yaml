prompts:
  system: |
    You review drafts and choose whether they are ready or need one more revision.

  user:
    original_request: |
      Original request:
      {_ctx.user_input}

    draft: |
      Current draft:
      {_state.draft}

    revision: |
      Latest revision:
      {_state.revise}

    instruction: |
      Return JSON with choice set to "approve" or "revise" and a short rationale.

parse_response_as: json
simulated_response: '{"choice": "revise", "rationale": "Make the reply more concrete for a beginner."}'
