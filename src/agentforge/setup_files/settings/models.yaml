# Default model settings for all agents unless overridden
default_model:
  api: gemini_api
  model: gemini_flash

# Example of using alternative default models
#  api: lm_studio_api
#  model: LMStudio

# Library of models and parameter defaults
model_library:
  openai_api:  # API script name
    O1Series:  # Class name for the API (Case Sensitive)
      models:  # List of model configurations
        o3:
          identifier: o3

      params: {}  # Default parameters for the model class

    GPT:
      models:
        gpt55_model:
          identifier: gpt-5.5
        gpt55_pro_model:
          identifier: gpt-5.5-pro
        gpt4o_model:
          identifier: gpt-4o
          params:
            max_completion_tokens: 15000  # Example of overriding parameters
        gpt41_model:
          identifier: gpt-4.1

      params:  # Default parameters for GPT models
        max_completion_tokens: 10000
        n: 1
        presence_penalty: 0
        stop: null
        temperature: 0.8
        top_p: 0.1

    # ------------------------------------------------------------------
    # Audio models
    # ------------------------------------------------------------------
    STT:  # Whisper Speech-to-Text
      models:
        whisper_base:
          identifier: whisper-1
          modality: stt  # primary modality tag (optional metadata)
          params: {}
        gpt4o_transcribe:
          identifier: gpt-4o-transcribe
          modality: stt
        gpt4o_mini_transcribe:
          identifier: gpt-4o-mini-transcribe
          modality: stt

      params:  # Defaults forwarded to STT wrapper
        response_format: text

    TTS:  # Text-to-Speech
      models:
        tts_standard:
          identifier: tts-1
          modality: tts
        gpt4o_mini_tts:
          identifier: gpt-4o-mini-tts
          modality: tts

      params:
        voice: alloy  # default voice
        response_format: wav  # default audio format

    Codex:
      models:
        codex_gpt55:
          identifier: gpt-5.5
        codex_gpt53_codex:
          identifier: gpt-5.3-codex

      params:
        reasoning:
          effort: medium
        timeout: 60
        verify_ssl: true
        host_url: https://chatgpt.com/backend-api/codex/responses

  anthropic_api:
    Claude:
      models:
        claude_opus_4_8:
          identifier: claude-opus-4-8
        claude_opus_4_7:
          identifier: claude-opus-4-7
        claude_opus_4_6:
          identifier: claude-opus-4-6
        claude_opus_4_5:
          identifier: claude-opus-4-5-20251101
        claude4_1opus:
          identifier: claude-opus-4-1-20250805
        claude_sonnet_4_6:
          identifier: claude-sonnet-4-6
        claude_sonnet_4_5:
          identifier: claude-sonnet-4-5-20250929
        claude_haiku_4_5:
          identifier: claude-haiku-4-5-20251001

      params:  # Default parameters for Claude models
        max_tokens: 10000

  gemini_api:
    Gemini:
      models:
        gemini_pro:
          identifier: gemini-3.1-pro-preview
        gemini_flash:
          identifier: gemini-3.5-flash
        gemini_3_flash_preview:
          identifier: gemini-3-flash-preview
        gemini_flash_lite:
          identifier: gemini-3.1-flash-lite

      params:  # Default parameters for Gemini models
        candidate_count: 1
        max_output_tokens: 10000
        temperature: 1.0
        top_k: 40
        top_p: 0.1

  lm_studio_api:
    LMStudio:
      models:
        llama3_8b:
          identifier: lmstudio-community/Meta-Llama-3-8B-Instruct-GGUF

      params:  # Default parameters for LMStudio models
        host_url: http://localhost:1234/v1/chat/completions
        max_tokens: 10000
        stream: false
        temperature: 0.8

    LMStudioVision:
      models:
        gemma4_vision:
          identifier: gemma-4-26b-a4b-it-heretic-guff

  litellm_api:
    LiteLLM:
      models:
        4o:
          identifier: gpt-4o-2024-08-06
          params:
            endpoint: openai
        qwen3_next_80b:
          identifier: qwen3-next-80b-a3b-instruct
          params:
            endpoint: lm_studio
            host_url: http://localhost:1234/v1/
        gemini_flash:
          identifier: gemini-3.5-flash
          params:
            endpoint: gemini

  ollama_api:
    Ollama:
      models:
        llama3.1_70b:
          identifier: llama3.1:70b

      params:  # Default parameters for Ollama models
        host_url: http://localhost:11434/api/generate
        num_predict: 10000
        stream: false
        temperature: 0.8

  openrouter_api:
    OpenRouter:
      models:
        phi3med:
          identifier: microsoft/phi-3-medium-128k-instruct:free
        hermes:
          identifier: nousresearch/hermes-3-llama-3.1-405b
        reflection:
          identifier: mattshumer/reflection-70b:free

  groq_api:
    GroqAPI:
      models:
        llama33_70b:
          identifier: llama-3.3-70b-versatile
        llama31:
          identifier: llama-3.3-70b-versatile
        llama31_8b:
          identifier: llama-3.1-8b-instant
        gpt_oss_120b:
          identifier: openai/gpt-oss-120b
        gpt_oss_20b:
          identifier: openai/gpt-oss-20b

      params:  # Default parameters for GroqAPI models
        max_completion_tokens: 10000
        stop: null
        temperature: 0.8
        top_p: 0.1

# Embedding library
embedding_library:
  library: sentence_transformers
